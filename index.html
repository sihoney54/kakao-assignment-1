<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>My Tasks</h1>

        <div class="date-nav">
            <button id="prev-date-btn" class="nav-btn">&lt;</button>
            <h2 id="current-date-display"></h2>
            <button id="next-date-btn" class="nav-btn">&gt;</button>
        </div>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요...">
            <button id="add-btn">추가</button>
        </div>
        
        <p id="error-msg" class="hidden">할 일을 입력해주세요!</p>

        <div class="filter-container">
            <button class="tab-btn active" data-filter="all">전체</button>
            <button class="tab-btn" data-filter="active">진행 중</button>
            <button class="tab-btn" data-filter="completed">완료</button>
        </div>
        
        <ul id="todo-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
